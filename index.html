<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3b82f6">
  <title>Tracker Posisi Izin Keluar - Bimbel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: #eff6ff; color: #111; padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; }
    header { background: #1d4ed8; color: white; padding: 16px; border-radius: 12px 12px 0 0; text-align: center; }
    h1 { font-size: 1.2rem; margin: 0; }
    .card-body { background: white; padding: 16px; border-radius: 0 0 12px 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

    .error-panel {
      display: none;
      background: #fef2f2;
      border: 2px solid #dc2626;
      color: #7f1d1d;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      margin-bottom: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .error-panel.visible { display: block; }

    .section { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #f1f5f9; }
    .section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #555; }
    input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.95rem; }

    .grid-lokasi { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .btn-lokasi { background: #f3f4f6; border: 2px solid #e5e7eb; padding: 10px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; text-align: center; color: #374151; transition: all 0.2s; }
    .btn-lokasi:active, .btn-lokasi.selected { background: #dbeafe; border-color: #3b82f6; color: #1e40af; }

    .btn-aksi { display: block; width: 100%; text-align: center; background: #2563eb; color: white; text-decoration: none; padding: 14px; border-radius: 8px; font-weight: 700; font-size: 1rem; border: none; cursor: pointer; margin-top: 16px; }
    .btn-aksi:active { background: #1d4ed8; }
    .btn-aksi:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-kembali { background: #16a34a; }
    .btn-kembali:active { background: #15803d; }

    .status-box { margin-top: 15px; padding: 14px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; display: none; }
    .student-name { font-size: 1.2rem; font-weight: 700; color: #1e293b; margin-bottom: 4px; }
    .student-status { font-size: 0.9rem; margin-bottom: 12px; font-weight: 600; }

    .badge-dalam { color: #16a34a; background: #dcfce7; padding: 2px 8px; border-radius: 4px; }
    .badge-luar { color: #d97706; background: #fef3c7; padding: 2px 8px; border-radius: 4px; }

    .live-list { margin-top: 15px; font-size: 0.85rem; }
    .live-item { background: #fffbeb; border: 1px solid #fde68a; padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    .live-item.warning { background: #fef2f2; border-color: #fecaca; }
    .live-durasi { font-size: 0.75rem; font-weight: 700; color: #b45309; }
    .live-durasi.long { color: #dc2626; }

    .scan-btn {
      background: #1d4ed8;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .scan-btn.stop { background: #dc2626; }
    #reader {
      display: none;
      margin-top: 12px;
      border-radius: 8px;
      overflow: hidden;
    }
    #reader.active { display: block; }

    .export-bar {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .export-bar button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-export-log { background: #0f766e; color: white; }
    .btn-clear-log { background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0 !important; }

    .conn-status { font-size: 0.75rem; text-align: center; margin-top: 8px; color: #64748b; }
    .conn-status.ok { color: #16a34a; }
    .conn-status.err { color: #dc2626; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📍 Tracker Posisi Izin Keluar</h1>
    </header>

    <div class="card-body">
      <div id="errorPanel" class="error-panel"></div>

      <!-- Scan / Input ID Kartu -->
      <div class="section">
        <label>Scan Kartu / Ketik ID atau Nama</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="inputID" placeholder="Scan QR ID di sini..." onkeypress="cekEnter(event)">
          <button class="scan-btn" id="btnScan" onclick="toggleScan()">📷 Scan</button>
          <button class="btn-aksi" style="margin-top:0; width: 80px;" onclick="cariSiswa()">Cari</button>
        </div>
        <div id="reader"></div>
        <div class="conn-status" id="connStatus">Menghubungkan...</div>
      </div>

      <!-- Panel Aksi Siswa -->
      <div id="statusBox" class="status-box">
        <div class="student-name" id="resNama">-</div>
        <div class="student-status" id="resStatus">-</div>

        <div id="panelKeluar" style="display: none;">
          <label>Pilih Tujuan Keluar:</label>
          <div class="grid-lokasi">
            <button class="btn-lokasi" onclick="pilihTujuan('Alfamart', this)">🏪 Alfamart</button>
            <button class="btn-lokasi" onclick="pilihTujuan('Tianlala', this)">🧋 Tianlala</button>
            <button class="btn-lokasi" onclick="pilihTujuan('MW', this)">🏬 MW</button>
            <button class="btn-lokasi" onclick="pilihTujuan('Jajan di depan', this)">🍢 Jajan di depan</button>
            <button class="btn-lokasi" onclick="pilihTujuan('Indomaret', this)">🛒 Indomaret</button>
            <button class="btn-lokasi" onclick="pilihTujuan('Ethan Cafe', this)">☕ Ethan Cafe</button>
            <button class="btn-lokasi" onclick="pilihTujuan('Print/Fotokopi', this)">📄 Print/Fotokopi</button>
            <button class="btn-lokasi" onclick="pilihTujuan('Tempat Lain', this)">📍 Tempat Lain</button>
          </div>

          <div class="section" id="boxLain" style="display: none; margin-top: 12px; border:none; padding:0;">
            <input type="text" id="inputLain" placeholder="Tuliskan tempat lainnya...">
          </div>

          <button class="btn-aksi" id="btnKeluar" onclick="catatKeluar()">Catat Keluar Gedung 🚀</button>
        </div>

        <div id="panelKembali" style="display: none;">
          <button class="btn-aksi btn-kembali" id="btnKembali" onclick="catatKembali()">✅ Sudah Kembali ke Bimbel</button>
        </div>
      </div>

      <!-- Live Daftar Siswa yang Sedang di Luar -->
      <div class="section" style="margin-top: 10px; border-top: 1px solid #e2e8f0; padding-top: 12px;">
        <label>🔴 Siswa yang Sedang di Luar Saat Ini:</label>
        <div id="liveContainer" class="live-list">
          <span style="color: #888; font-size: 0.8rem;">Memuat data...</span>
        </div>
      </div>

      <!-- Ekspor Log -->
      <div class="section" style="border-top: 1px solid #e2e8f0; padding-top: 12px; margin-top: 10px;">
        <label>📋 Arsip Aktivitas (<span id="logCount">0</span> catatan)</label>
        <div class="export-bar">
          <button class="btn-export-log" onclick="eksporLog()">📤 Ekspor Log CSV</button>
          <button class="btn-clear-log" onclick="hapusLog()">🗑️ Hapus</button>
        </div>
        <small style="color: #888; font-size: 0.7rem; display: block; margin-top: 6px;">
          Log tersimpan di database dan tersinkron real-time antar perangkat.
        </small>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // KONFIGURASI
    // ============================================================
    const SUPABASE_URL = 'https://yjdumalkhkjujcflecmc.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlqZHVtYWxraGtqdWpjZmxlY21jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxNDE0NzMsImV4cCI6MjExMDcxNzQ3M30.Zr8V71wh2-juFeDh6D549qlTooTcb3rO118rCYriww0';

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let dbSiswa = [];
    let siswaAktif = null;
    let tujuanTerpilih = "";
    let logAktivitas = [];

    // ===== PANEL ERROR DI LAYAR =====
    function tampilkanError(label, err) {
      const panel = document.getElementById('errorPanel');
      let pesan = '';
      if (err && err.message) pesan = err.message;
      else if (err && err.error_description) pesan = err.error_description;
      else if (typeof err === 'string') pesan = err;
      else if (err) pesan = JSON.stringify(err);
      panel.textContent = '⚠️ ' + label + ': ' + pesan;
      panel.classList.add('visible');
    }

    function sembunyikanError() {
      const panel = document.getElementById('errorPanel');
      panel.classList.remove('visible');
      panel.textContent = '';
    }

    // ===== UTIL =====
    function setConnStatus(text, cls) {
      const el = document.getElementById('connStatus');
      el.textContent = text;
      el.className = 'conn-status' + (cls ? ' ' + cls : '');
    }

    function hitungDurasi(isoKeluar) {
      if (!isoKeluar) return 0;
      const selisihMs = Date.now() - new Date(isoKeluar).getTime();
      return Math.max(0, Math.round(selisihMs / 60000));
    }

    // ===== SINKRONISASI DATA SISWA DARI GITHUB =====
    async function syncStudentsFromJSON() {
      try {
        const res = await fetch('./data/students.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('File data/students.json tidak ditemukan (HTTP ' + res.status + ')');
        const students = await res.json();
        if (!Array.isArray(students) || students.length === 0) {
          throw new Error('students.json kosong atau format salah');
        }
        const payload = students
          .filter(s => s && s.id && s.nama)
          .map(s => ({ id: String(s.id), nama: String(s.nama) }));
        if (payload.length === 0) throw new Error('Tidak ada entri valid di students.json');

        const { error } = await sb
          .from('students')
          .upsert(payload, { onConflict: 'id' });
        if (error) throw error;
        console.log(`Sinkronisasi siswa: ${payload.length} entri`);
      } catch (err) {
        console.error('Sinkronisasi gagal:', err);
        tampilkanError('Sinkronisasi siswa gagal', err);
      }
    }

    // ===== MUAT DATA =====
    async function loadStudents() {
      const { data, error } = await sb.from('students').select('*').order('nama');
      if (error) {
        console.error('loadStudents:', error);
        tampilkanError('Muat data siswa gagal', error);
        return;
      }
      dbSiswa = data || [];
      updateLiveList();
      if (siswaAktif) {
        const updated = dbSiswa.find(s => s.id === siswaAktif.id);
        if (updated) { siswaAktif = updated; renderPanelSiswa(); }
        else resetForm();
      }
    }

    async function loadLogs() {
      const { data, error } = await sb.from('activity_logs')
        .select('*').order('created_at', { ascending: true });
      if (error) {
        console.error('loadLogs:', error);
        tampilkanError('Muat log gagal', error);
        return;
      }
      logAktivitas = data || [];
      document.getElementById('logCount').textContent = logAktivitas.length;
    }

    // ===== REALTIME =====
    function subscribeRealtime() {
      sb.channel('students-realtime')
        .on('postgres_changes',
          { event: '*', schema: 'public', table: 'students' },
          () => loadStudents())
        .subscribe((status, err) => {
          if (status === 'SUBSCRIBED') {
            setConnStatus('🟢 Tersambung real-time', 'ok');
          } else if (status === 'CHANNEL_ERROR') {
            setConnStatus('🔴 Gagal real-time', 'err');
            tampilkanError('Realtime', err ? (err.message || JSON.stringify(err)) : 'Gagal berlangganan kanal students');
          }
        });

      sb.channel('logs-realtime')
        .on('postgres_changes',
          { event: '*', schema: 'public', table: 'activity_logs' },
          () => loadLogs())
        .subscribe();
    }

    // ===== SCAN QR =====
    let html5QrCode = null;
    let scanning = false;

    function toggleScan() {
      if (scanning) stopScan();
      else startScan();
    }

    function startScan() {
      html5QrCode = new Html5Qrcode("reader");
      document.getElementById("reader").classList.add("active");

      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess,
        () => {}
      ).then(() => {
        scanning = true;
        const btn = document.getElementById("btnScan");
        btn.textContent = "⏹ Stop";
        btn.classList.add("stop");
      }).catch(err => {
        alert("Gagal buka kamera: " + err);
        document.getElementById("reader").classList.remove("active");
      });
    }

    function stopScan() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          html5QrCode = null;
        }).catch(() => {});
      }
      scanning = false;
      document.getElementById("reader").classList.remove("active");
      const btn = document.getElementById("btnScan");
      btn.textContent = "📷 Scan";
      btn.classList.remove("stop");
    }

    function onScanSuccess(decodedText) {
      document.getElementById("inputID").value = decodedText.trim();
      stopScan();
      cariSiswa();
    }

    function cekEnter(e) {
      if (e.key === 'Enter') cariSiswa();
    }

    // ===== CARI SISWA =====
    function cariSiswa() {
      const idInput = document.getElementById('inputID').value.trim();
      if (!idInput) return;

      siswaAktif = dbSiswa.find(s =>
        s.id.toLowerCase() === idInput.toLowerCase() ||
        s.nama.toLowerCase().includes(idInput.toLowerCase())
      );

      if (siswaAktif) {
        renderPanelSiswa();
        document.getElementById('statusBox').style.display = 'block';
      } else {
        document.getElementById('statusBox').style.display = 'none';
        alert(`ID atau Nama "${idInput}" tidak ditemukan!`);
      }

      document.getElementById('inputID').value = '';
      document.getElementById('inputID').focus();
    }

    // ===== RENDER PANEL SISWA AKTIF =====
    function renderPanelSiswa() {
      if (!siswaAktif) return;
      document.getElementById('resNama').innerText =
        "👤 " + siswaAktif.nama + " (" + siswaAktif.id + ")";

      const panelKeluar = document.getElementById('panelKeluar');
      const panelKembali = document.getElementById('panelKembali');

      if (siswaAktif.status === "di_dalam") {
        document.getElementById('resStatus').innerHTML =
          `Status: <span class="badge-dalam">Sedang di dalam bimbel</span>`;
        panelKeluar.style.display = 'block';
        panelKembali.style.display = 'none';
      } else {
        const durasi = hitungDurasi(siswaAktif.waktu_keluar_iso);
        document.getElementById('resStatus').innerHTML =
          `Status: <span class="badge-luar">Keluar ke ${siswaAktif.tujuan} (${siswaAktif.waktu}) — sudah ${durasi} menit</span>`;
        panelKeluar.style.display = 'none';
        panelKembali.style.display = 'block';
      }
    }

    // ===== PILIH TUJUAN =====
    function pilihTujuan(tujuan, el) {
      document.querySelectorAll('.btn-lokasi').forEach(b => b.classList.remove('selected'));
      el.classList.add('selected');
      tujuanTerpilih = tujuan;

      const boxLain = document.getElementById('boxLain');
      if (tujuan === 'Tempat Lain') {
        boxLain.style.display = 'block';
        document.getElementById('inputLain').focus();
      } else {
        boxLain.style.display = 'none';
      }
    }

    // ===== CATAT KELUAR =====
    async function catatKeluar() {
      if (!tujuanTerpilih) { alert("Pilih tujuan keluar terlebih dahulu!"); return; }

      let finalTujuan = tujuanTerpilih;
      if (finalTujuan === 'Tempat Lain') {
        finalTujuan = document.getElementById('inputLain').value.trim() || 'Tempat Lain';
      }

      const btn = document.getElementById('btnKeluar');
      btn.disabled = true;
      btn.textContent = 'Menyimpan...';

      const now = new Date();
      const waktuKeluar = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

      const { error: errUpdate } = await sb.from('students').update({
        status: 'di_luar',
        tujuan: finalTujuan,
        waktu: waktuKeluar,
        waktu_keluar_iso: now.toISOString(),
        updated_at: now.toISOString()
      }).eq('id', siswaAktif.id);

      if (errUpdate) {
        alert('Gagal menyimpan: ' + errUpdate.message);
        tampilkanError('Catat keluar gagal', errUpdate);
        btn.disabled = false;
        btn.textContent = 'Catat Keluar Gedung 🚀';
        return;
      }

      await sb.from('activity_logs').insert({
        student_id: siswaAktif.id,
        nama: siswaAktif.nama,
        aksi: 'keluar',
        tujuan: finalTujuan
      });

      btn.disabled = false;
      btn.textContent = 'Catat Keluar Gedung 🚀';
      resetForm();
      await loadStudents();
    }

    // ===== CATAT KEMBALI =====
    async function catatKembali() {
      if (!siswaAktif) return;
      const btn = document.getElementById('btnKembali');
      btn.disabled = true;
      btn.textContent = 'Menyimpan...';

      const durasi = hitungDurasi(siswaAktif.waktu_keluar_iso);
      const namaSiswa = siswaAktif.nama;
      const tujuanSiswa = siswaAktif.tujuan;

      const { error: errUpdate } = await sb.from('students').update({
        status: 'di_dalam',
        tujuan: '',
        waktu: '',
        waktu_keluar_iso: null,
        updated_at: new Date().toISOString()
      }).eq('id', siswaAktif.id);

      if (errUpdate) {
        alert('Gagal menyimpan: ' + errUpdate.message);
        tampilkanError('Catat kembali gagal', errUpdate);
        btn.disabled = false;
        btn.textContent = '✅ Sudah Kembali ke Bimbel';
        return;
      }

      await sb.from('activity_logs').insert({
        student_id: siswaAktif.id,
        nama: namaSiswa,
        aksi: 'kembali',
        tujuan: tujuanSiswa,
        durasi_menit: durasi
      });

      btn.disabled = false;
      btn.textContent = '✅ Sudah Kembali ke Bimbel';
      resetForm();
      await loadStudents();
      alert(`✅ ${namaSiswa} kembali. Durasi di luar: ${durasi} menit.`);
    }

    // ===== RESET FORM =====
    function resetForm() {
      document.getElementById('statusBox').style.display = 'none';
      siswaAktif = null;
      tujuanTerpilih = "";
      document.querySelectorAll('.btn-lokasi').forEach(b => b.classList.remove('selected'));
      document.getElementById('boxLain').style.display = 'none';
      document.getElementById('inputLain').value = '';
      document.getElementById('inputID').focus();
    }

    // ===== LIVE LIST =====
    function updateLiveList() {
      const container = document.getElementById('liveContainer');
      const siswaDiLuar = dbSiswa.filter(s => s.status === "di_luar");

      if (siswaDiLuar.length === 0) {
        container.innerHTML = `<span style="color: #888; font-size: 0.8rem;">Tidak ada siswa di luar.</span>`;
        return;
      }

      container.innerHTML = "";
      siswaDiLuar.forEach(s => {
        const durasi = hitungDurasi(s.waktu_keluar_iso);
        const isLong = durasi >= 30;
        const item = document.createElement("div");
        item.className = "live-item" + (isLong ? " warning" : "");
        item.innerHTML = `
          <div><strong>${s.nama}</strong> ➔ ${s.tujuan}</div>
          <div style="text-align:right">
            <div style="font-size:0.7rem;color:#b45309">Keluar: ${s.waktu}</div>
            <div class="live-durasi${isLong ? " long" : ""}">${durasi} menit${isLong ? " ⚠️" : ""}</div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    // ===== EKSPOR LOG =====
    function eksporLog() {
      if (logAktivitas.length === 0) {
        alert("Belum ada log aktivitas untuk diekspor.");
        return;
      }

      let csv = "Waktu,ID,Nama,Aksi,Tujuan,Durasi (menit)\n";
      logAktivitas.forEach(l => {
        const waktuLokal = new Date(l.created_at).toLocaleString("id-ID");
        const durasi = l.durasi_menit != null ? l.durasi_menit : "";
        const nama = (l.nama || '').replace(/"/g, '""');
        const tujuan = (l.tujuan || '').replace(/"/g, '""');
        csv += `"${waktuLokal}",${l.student_id},"${nama}",${l.aksi},"${tujuan}",${durasi}\n`;
      });

      const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      const tglFile = new Date().toISOString().slice(0, 10);
      link.href = URL.createObjectURL(blob);
      link.download = `log_izin_keluar_${tglFile}.csv`;
      link.click();
    }

    // ===== HAPUS LOG =====
    async function hapusLog() {
      if (logAktivitas.length === 0) return;
      if (!confirm(`Hapus ${logAktivitas.length} catatan log dari database? Pastikan sudah diekspor.`)) return;

      const { error } = await sb.from('activity_logs').delete().neq('id', 0);
      if (error) {
        alert('Gagal menghapus log: ' + error.message);
        tampilkanError('Hapus log gagal', error);
        return;
      }
      await loadLogs();
    }

    // ===== INIT =====
    (async function init() {
      setConnStatus('Menghubungkan...');
      await syncStudentsFromJSON();
      await loadStudents();
      await loadLogs();
      subscribeRealtime();

      setInterval(() => {
        if (dbSiswa.some(s => s.status === "di_luar")) updateLiveList();
      }, 30000);
    })();
  </script>
</body>
</html>
